<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工作台预览 v4 · IDE 色板 × Lucide 真图标</title>
<style>
:root{
  --chrome:#F8F8F8;--editor:#FFFFFF;--fg:#3B3B3B;--fg-muted:#616161;--fg-inactive:#868686;
  --border:#E5E5E5;--accent:#005FB8;--accent-fg:#FFFFFF;--hover:rgba(0,0,0,.05);
  --shadow-1:0 2px 4px rgba(0,0,0,.08);--shadow-2:0 4px 12px rgba(0,0,0,.12);
  --font-sans:"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;
  --font-mono:Consolas,"Cascadia Mono",monospace;
}
.dark{
  --chrome:#181818;--editor:#1F1F1F;--fg:#CCCCCC;--fg-muted:#9D9D9D;--fg-inactive:#868686;
  --border:#2B2B2B;--accent:#0078D4;--accent-fg:#FFFFFF;--hover:rgba(255,255,255,.06);
  --shadow-1:0 2px 4px rgba(0,0,0,.4);--shadow-2:0 4px 14px rgba(0,0,0,.5);
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:var(--font-sans);font-size:13px;color:var(--fg);background:var(--chrome);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.35);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit}
.svg{display:inline-block;vertical-align:middle;flex-shrink:0}

/* ── titlebar ── */
.titlebar{height:35px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--chrome);border-bottom:1px solid var(--border)}
.menus{display:flex;gap:2px}
.menus span{padding:3px 8px;border-radius:4px;font-size:12px;cursor:default}
.menus span:hover{background:var(--hover)}
.brand{font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:7px}
.brand .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:breath 2.4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.grow{flex:1}
.rg{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:5px;background:var(--chrome)}
.rg button{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--fg-muted);padding:3px 10px;font-size:11.5px;cursor:pointer;border-radius:4px}
.rg button.on{color:var(--fg);background:var(--editor);box-shadow:var(--shadow-1);font-weight:600}
.tb-icon{width:30px;height:30px;display:grid;place-items:center;border:none;background:none;color:var(--fg);cursor:pointer;border-radius:4px}
.tb-icon:hover{background:var(--hover)}

/* ── 工作台 ── */
.workbench{display:flex;height:calc(100vh - 35px - 22px)}
.activitybar{width:48px;background:var(--chrome);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:4px 0;flex-shrink:0}
.act{width:48px;height:44px;display:grid;place-items:center;border:none;background:none;color:var(--fg-inactive);cursor:pointer;position:relative}
.act:hover{color:var(--fg)}
.act.active{color:var(--fg)}
.act.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.act svg{width:20px;height:20px}
.act-bottom{margin-top:auto}

.sidebar{width:240px;background:var(--chrome);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.side-head{padding:9px 14px 6px;font-size:11px;color:var(--fg-muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.side-head .svg{color:var(--fg-muted)}
.ai-head .svg{color:var(--fg-muted)}
.side-head .svg{color:var(--fg-muted)}
.side-body{flex:1;overflow:auto;padding:0 8px 12px;font-size:13px}
.tree{list-style:none;margin:0;padding:0}
.tree li{padding:4px 8px;border-radius:4px;display:flex;align-items:center;gap:6px;cursor:default;white-space:nowrap}
.tree li:hover{background:var(--hover)}
.tree li.sel{background:color-mix(in srgb,var(--accent) 12%,transparent);outline:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.tree li .svg{color:var(--fg-muted)}
.tree li .sz{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--fg-muted)}
.tree li.dir::before{content:'';width:0}
.tree li.root{font-weight:600}
.tree ul{list-style:none;margin:0;padding-left:15px}
.side-info{padding:4px 10px;font-size:12px;color:var(--fg-muted);line-height:1.8}
.side-info b{color:var(--fg);font-family:var(--font-mono)}

.maincol{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--editor)}
.tabbar{height:35px;display:flex;align-items:stretch;padding:0 6px;background:var(--chrome);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.edittab{display:inline-flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;color:var(--fg-inactive);background:none;border:none;border-top:1px solid transparent;border-right:1px solid transparent;cursor:pointer;white-space:nowrap;max-width:190px;font-family:inherit;position:relative}
.edittab:hover{color:var(--fg)}
.edittab.active{color:var(--fg);background:var(--editor);border-color:var(--border);border-bottom-color:var(--editor);border-top-color:transparent}
.edittab.active::before{content:'';position:absolute;top:-1px;left:-1px;right:-1px;height:2px;background:var(--accent)}
.edittab .svg{width:13px;height:13px;color:var(--fg-muted)}
.edittab.active .svg{color:var(--accent)}
.edittab .x{opacity:0;width:17px;height:17px;display:grid;place-items:center;border-radius:4px}
.edittab:hover .x{opacity:.7}
.edittab .x:hover{background:var(--hover);opacity:1;color:var(--danger)}
.tabbar .plus,.tabbar .home{width:30px;border:none;background:none;color:var(--fg-muted);cursor:pointer;font-size:14px;flex-shrink:0;display:grid;place-items:center}
.tabbar .plus:hover,.tabbar .home:hover{background:var(--hover);color:var(--fg)}

.editorarea{flex:1;overflow:auto;min-height:0;background:var(--editor)}
.bottompanel{height:158px;border-top:1px solid var(--border);background:var(--chrome);display:flex;flex-direction:column;flex-shrink:0}
.bp-head{display:flex;align-items:center;gap:2px;padding:2px 10px 4px;border-bottom:1px solid var(--border)}
.bptab{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:11.5px;color:var(--fg-muted);background:none;border:none;border-bottom:1px solid transparent;cursor:pointer}
.bptab:hover{color:var(--fg)}
.bptab.on{color:var(--fg);border-bottom-color:var(--fg)}
.bptab .svg{width:13px;height:13px}
.bp-head .right{margin-left:auto;font-size:11px;font-family:var(--font-mono)}
.bp-body{flex:1;overflow:auto;padding:8px 14px;font-size:12px;font-family:var(--font-mono);line-height:1.9;color:var(--fg-muted)}
.bp-body [info]{color:var(--accent)}
.bp-body [warn]{color:var(--warn)}

.aipanel{width:300px;border-left:1px solid var(--border);background:var(--chrome);display:flex;flex-direction:column;flex-shrink:0}
.ai-head{padding:9px 14px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.ai-head .svg{color:var(--fg-muted)}
.ai-actions{display:flex;gap:3px;color:var(--fg-muted)}
.ai-actions .svg{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden;margin:0 0 8px}
.seg button{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border:none;background:var(--editor);color:var(--fg-muted);padding:4px 8px;font-size:11px;border-right:1px solid var(--border);cursor:pointer}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--secondary);color:var(--fg);font-weight:600}
.seg button:hover{color:var(--fg);background:var(--accent)}
.ai-head .svg{color:var(--accent)}
.ai-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;line-height:1.75}
.msg{max-width:94%;padding:8px 12px;border-radius:8px}
.msg.user{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--chrome));border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.msg.ai{align-self:flex-start;background:var(--editor);border:1px solid var(--border)}
.ai-input{padding:10px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.ai-input textarea{flex:1;height:54px;resize:none;border:1px solid var(--border);border-radius:6px;background:var(--editor);color:var(--fg);font-family:inherit;font-size:12.5px;padding:9px;outline:none;transition:border .15s}
.ai-input textarea:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.send{width:36px;height:36px;display:grid;place-items:center;border:none;border-radius:6px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.send svg{width:15px;height:15px}

.statusbar{height:22px;display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--chrome);border-top:1px solid var(--border);font-size:11px;color:var(--fg-muted)}
.statusbar .chip{cursor:pointer;border:1px solid var(--border);padding:0 8px;border-radius:3px}
.statusbar .chip:hover{color:var(--fg);background:var(--hover)}

/* ── 入口页 ── */
.entrypage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.entry-hello{font-size:26px;font-weight:300;letter-spacing:.01em}
.entry-hello b{font-weight:600}
.entry-hint{font-size:12px;color:var(--fg-muted);margin-top:-16px}
.entry-grid{display:grid;grid-template-columns:repeat(3,190px);gap:14px}
.entry{border:1px solid var(--border);border-radius:6px;background:var(--chrome);cursor:pointer;padding:14px;display:flex;gap:12px;align-items:center;font-family:inherit;text-align:left;transition:border-color .12s,box-shadow .12s}
.entry:hover{border-color:var(--accent);box-shadow:var(--shadow-1)}
.entry .ico{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;flex-shrink:0}
.entry .ico svg{width:18px;height:18px}
.entry .ico.c-info{background:color-mix(in srgb,var(--accent) 14%,var(--chrome))}.entry .ico.c-info svg{color:var(--accent)}
.entry .ico.c-ok{background:color-mix(in srgb,var(--ok) 16%,var(--chrome))}.entry .ico.c-ok svg{color:var(--ok)}
.entry .ico.c-warn{background:color-mix(in srgb,var(--warn) 16%,var(--chrome))}.entry .ico.c-warn svg{color:var(--warn)}
.entry .ico.c-violet{background:color-mix(in srgb,#8b5cf6 14%,var(--chrome))}.entry .ico.c-violet svg{color:#8b5cf6}
.entry .cap{display:flex;flex-direction:column;gap:1px;min-width:0}
.entry .cap b{font-size:13px;font-weight:600}
.entry .cap small{font-size:11px;color:var(--fg-muted)}

/* ── tab 内容 ── */
.tbody{padding:14px 18px;font-size:13px}
.crumb{font-family:var(--font-mono);font-size:11.5px;color:var(--fg-muted);padding:6px 16px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--chrome)}
.crumb .sz{margin-left:auto}
.tm{display:flex;flex-direction:column;height:calc(100% - 30px);padding:10px;gap:4px}
.trow{display:flex;gap:4px;flex:1;min-height:0}
.tm .blk{border-radius:4px;padding:8px 10px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;cursor:default;outline:1px solid transparent;transition:outline .1s}
.tm .blk:hover{outline:2px solid var(--accent)}
.tm b{display:block;font-family:var(--font-mono);font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .blk span{font-size:9.5px;opacity:.8;font-family:var(--font-mono)}
.bucket{display:flex;align-items:center;gap:12px;padding:9px 13px;border:1px solid var(--border);border-radius:5px;background:var(--chrome);margin-bottom:6px;cursor:pointer}
.bucket:hover{background:var(--hover)}
.bucket b{font-family:var(--font-mono);font-size:12.5px}
.bucket .go{margin-left:auto;color:var(--accent);font-size:12px;cursor:pointer}
table.list{width:100%;border-collapse:collapse;font-size:12.5px}
table.list th{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--border)}
table.list td{padding:7px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;padding:1px 9px;border-radius:3px;font-family:var(--font-mono);font-size:10.5px;border:1px solid var(--border);color:var(--fg-muted)}
</style>
</head>
<body>

<div class="titlebar">
  <span class="brand"><span class="dot"></span> Pinkbin</span>
  <div class="menus"><span>文件</span><span>编辑</span><span>查看</span><span>扫描</span><span>帮助</span></div>
  <div class="grow"></div>
  <div class="rg" title="区域组合——对应你的五张截图">
    <button data-rg="sidebar" class="on" title="侧栏"><span class="svg" data-icon="panel-left"></span></button>
    <button data-rg="bottom" class="on" title="底面板"><span class="svg" data-icon="panel-bottom"></span></button>
    <button data-rg="ai" class="on" title="AI 面板"><span class="svg" data-icon="panel-right"></span></button>
  </div>
  <button class="tb-icon" id="themeBtn" title="深浅切换（dark_modern 色板）">☾</button>
</div>

<div class="workbench">
  <nav class="activitybar">
    <button class="act active" data-side="explorer" title="资源管理器"><span class="svg" data-icon="folder-tree"></span></button>
    <button class="act" data-side="queue" title="巡查队列"><span class="svg" data-icon="list-checks"></span></button>
    <button class="act" data-side="scripts" title="脚本列表"><span class="svg" data-icon="package"></span></button>
    <button class="act" data-side="records" title="记录筛选"><span class="svg" data-icon="history"></span></button>
    <button class="act act-bottom" title="设置"><span class="svg" data-icon="settings"></span></button>
  </nav>

  <aside class="sidebar" id="sidebar">
    <div class="side-head" id="sideHead"></div>
    <div class="side-body" id="sideBody"></div>
  </aside>

  <section class="maincol">
    <div class="tabbar" id="tabbar">
      <button class="home" title="入口页"><span class="svg" data-icon="home"></span></button>
      <button class="plus" title="新标签页"><span class="svg" data-icon="plus"></span></button>
      <div class="grow"></div>
    </div>
    <div class="editorarea" id="editorarea"></div>
    <section class="bottompanel" id="bottompanel">
      <div class="bp-head" id="bpHead"></div>
      <div class="bp-body" id="bpBody"></div>
    </section>
  </section>

  <aside class="aipanel" id="aipanel">
    <div class="ai-head"><span class="svg" data-icon="bot"></span> AI 顾问 <span class="grow"></span><span class="ai-actions"><span class="svg" data-icon="square-pen"></span><span class="svg" data-icon="history"></span><span class="svg" data-icon="search"></span><span class="svg" data-icon="x"></span></span><span class="pill">ollama</span></div>
    <div class="ai-body" id="aiBody">
      <div class="msg user">xwechat_files 这个文件夹是什么？能删吗？</div>
      <div class="msg ai">这是微信 4.x 的数据根目录（含聊天媒体缓存、接收的文件）。<b>聊天数据库、收藏、账号状态是红线，不会被清理脚本触碰</b>；媒体缓存和超过保留期的接收文件可以走脚本回收。</div>
      <div class="msg user">那 Steam 呢？</div>
      <div class="msg ai">Steam 库在右侧「在 Steam 中卸载」更安全——游戏文件不建议直接删，Inspector 只做盘点不代删。</div>
    </div>
    <div class="ai-input">
      <textarea placeholder="帮你看目录、判风险、给清理建议…"></textarea>
      <button class="send" title="发送"><span class="svg" data-icon="send"></span></button>
    </div>
  </aside>
</div>

<footer class="statusbar">
  <span>C:\ （浏览器预览 · mock 数据）</span>
  <span>187.1 GB · 805,990 文件</span>
  <div class="grow"></div>
  <span>9 个脚本</span><span class="chip">A·md</span><span>v0.1.2</span>
</footer>

    ${row('folder','Users','90.3 GB',1)}${row('folder','Windows','36.2 GB',1)}${row('folder','Program Files','24.5 GB',1)}
    ${row('folder','xwechat_files','21.4 GB',1)}${row('folder','conda','9.8 GB',1)}${row('folder','SteamLibrary','58.0 GB',1)}
    ${row('file','hiberfil.sys','12.8 GB')}${row('file','pagefile.sys','8.0 GB')}</ul></ul>`;
}

    <div class="bucket"><b>🟢 100% 可清</b>12 项 · 12.4 GB<span class="go">开巡查 →</span></div>
    <div class="bucket"><b>🟠 占用大但你常用</b>4 项 · 58.0 GB<span class="go">开巡查 →</span></div>

    <div class="bucket"><b>🔵 AI 不确定</b>2 项 · 1.1 GB<span class="go">让 AI 分析 →</span></div>
    <div class="bucket"><b>⚫ 系统/不能动</b>9 项 · 46.2 GB</div></div>`,

    <tr><td>09-27 14:02</td><td><span class="pill">回收站</span></td><td>C:/Users/90740/AppData/Local/npm-cache</td></tr>

  entry: () => entryHTML(),
};
function entryHTML(){
  const card = (k,c,ic,cap,sub)=>`<button class="entry" data-open="${k}"><span class="ico ${c}">${icon(ic,18)}</span><span class="cap"><b>${cap}</b><small>${sub}</small></span></button>`;
  return `<div class="entrypage">
    <div class="entry-hello">开始清理 <b>C:</b></div>
    <div class="entry-hint">点卡片打开一个标签页 · 顶部可多开 · 可关闭 · 各区域可独立折叠</div>
    <div class="entry-grid">
      ${card('map','c-info','map','空间图','C: 已扫描')}
      ${card('walk','c-ok','list-checks','巡查','分诊报告')}
      ${card('script:conda','c-warn','package','脚本库','9 个')}
      ${card('records','c-violet','history','操作记录','undo')}
      ${card('map','c-info','map','空间图','D: 盘')}
      ${card('records','c-neutral','settings','设置','AI · 主题 · 字号')}
    </div></div>`;
}

function renderTabbar(){
  tabbar.querySelectorAll('.edittab').forEach(e=>e.remove());
  const plus = tabbar.querySelector('.plus');
  tabs.forEach(t=>{
    const ic = t.kind==='map' ? 'map' : t.kind==='walk' ? 'list-checks' : t.kind==='script:conda' ? 'package' : 'history';
    const b=document.createElement('button');
    b.className='edittab'+(t.id===activeId?' active':'');
    b.innerHTML=`${icon(ic,13)}<span>${t.title}</span><span class="x" data-close="${t.id}">${icon('x',12)}</span>`;
    b.onclick=e=>{ if(e.target.closest('[data-close]')){ closeTab(t.id); } else { activeId=t.id; renderTabbar(); renderEditor(); } };
    tabbar.insertBefore(b, plus);
  });
}
function renderEditor(){
  const t = tabs.find(x=>x.id===activeId);
  editor.innerHTML = t ? CONTENT[t.kind](t) : entryHTML();
  editor.querySelectorAll('[data-open]').forEach(c=>c.onclick=()=>openTab(c.dataset.open, c.querySelector('.cap b').textContent));
}
function openTab(kind, title, crumb){
  const dup = tabs.find(t=>t.kind===kind && t.title===title);
  if (dup){ activeId=dup.id; renderTabbar(); renderEditor(); return; }
  const t = { id:'t'+(++seq), kind, title: title || kind, crumb };
  tabs.push(t); activeId=t.id; renderTabbar(); renderEditor();
}
function closeTab(id){
  const i = tabs.findIndex(t=>t.id===id);
  tabs.splice(i,1);
  if (activeId===id) activeId = tabs.length ? tabs[Math.max(0,i-1)].id : null;
  renderTabbar(); renderEditor();
}
tabbar.querySelector('.plus').onclick = ()=>{ activeId=null; renderTabbar(); renderEditor(); };
tabbar.querySelector('.home').onclick = ()=>{ activeId=null; renderTabbar(); renderEditor(); };

    <div>ipc_ms=41 · setRoot_ms=8 · total_ms=2,577 · mode=mft · dirs_in_acc=0</div>` },
  records: { ic: 'history', label: '记录', html: `<table class="list"><tr><th>时间</th><th>动作</th><th>路径</th></tr>
    <tr><td>09-27 14:02</td><td>回收站</td><td>C:/Users/90740/AppData/Local/npm-cache</td></tr>
    <tr><td>09-27 13:47</td><td>隔离</td><td>D:/tmp/old-build</td></tr></table>` },
};
const bpHead = document.getElementById('bpHead'), bpBody = document.getElementById('bpBody');
let bpActive = 'out';
function renderBP(){
  bpHead.innerHTML = Object.entries(BP).map(([id, t]) =>
    `<button class="bptab${bpActive===id?' on':''}" data-bp="${id}">${icon(t.ic,13)}${t.label}</button>`).join('')
    + `<span class="right">2026-09-27</span>`;
  bpBody.innerHTML = BP[bpActive].html;
  bpHead.querySelectorAll('[data-bp]').forEach(b => b.onclick = () => { bpActive = b.dataset.bp; renderBP(); });
}
renderBP();

// 初始：预开两个 tab 展示多开
openTab('map','空间图 · C:','C:');
openTab('records','操作记录');
renderEditor();
</script>
