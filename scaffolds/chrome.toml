# Google Chrome 清理 scaffold —— Chromium 通用桶设计。
# 设计依据：docs/research/python-dev-cleanup-landscape.md §2.2 的 IDE/Chromium 桶分级
# （DIPS / SharedStorage 等拿不准目录划红线的先例）+ §3 产品哲学（只收 80% 痛点桶，
# 不做 geek 化细分）；红线继承 CLAUDE.md Hard rule 1。
#
# 实测回环（2026-09-28，Windows 11，只 ls 目录名、未 Read 任何内容）：
# - 本机未安装 Google Chrome（%LOCALAPPDATA%\Google 不存在，Program Files 下无 Google），
#   也没有 Edge（%LOCALAPPDATA%\Microsoft\Edge 不存在）。
# - 用同机真实存在的两棵 Chromium 树验证了桶名（结构同源）：
#   * %LOCALAPPDATA%/Quark/User Data（Chromium fork，完整 User Data 布局）
#   * %LOCALAPPDATA%/CEF/User Data（CEF 内嵌壳）
# - 实测确认的 User Data 顶层可清桶：GrShaderCache / GraphiteDawnCache / ShaderCache /
#   Crashpad / component_crx_cache / extensions_crx_cache。
# - 实测确认的 profile 级可清桶：Cache（内含 Cache_Data） / Code Cache / GPUCache /
#   DawnGraphiteCache / DawnWebGPUCache / Service Worker（内含 Database、ScriptCache） /
#   blob_storage。
# - 实测存在、一律划红线的目录（见 disclaimer + chrome_safety.rs）：Bookmarks(.bak)、
#   History(-journal)、Login Data(-j)、Login Data For Account、Web Data(-j)、Favicons(-j)、
#   Preferences / Secure Preferences、Network（Cookies）、Local Storage、Session Storage、
#   IndexedDB、WebStorage、Sessions、Sync Data、Extension State、Local Extension Settings、
#   Extension Rules、Extension Scripts、GCM Store、Shortcuts、Top Sites、Local State、
#   Safe Browsing、First Run、Last Browser、Last Version、WidevineCdm、DIPS(-wal)、
#   SharedStorage(-wal)、Shared Dictionary、BrowsingTopics*、BudgetDatabase、
#   chrome_cart_db、discounts_db、commerce_subscription_db、parcel_tracking_db、
#   heavy_ad_intervention_opt_out.db、optimization_guide_hint_cache_store、
#   ClientCertificates、MediaDeviceSalts、passkey_enclave_state、trusted_vault.pb、
#   Account Web Data、Affiliation Database。
#
# scope 锚定 **/Google/Chrome*/User Data/...：
# - Chrome* 一个前缀通配覆盖 Chrome / Chrome Beta / Chrome Dev / Chrome SxS(Canary)
#   四个 channel（vscode.toml 用 alternation 枚举两实例，channel 多，改用前缀通配）。
# - 不用裸 **/User Data：本机实测 Quark、CEF、Tabbit Browser 都有同名 User Data 根，
#   裸锚会把其它 Chromium 应用的树混进"Chrome"卡片。
# - 多 profile：Chrome 的 profile 目录是 Default / Profile 1 / Profile 2 ...，
#   glob 用 {Default,Profile *} 一层 alternation 覆盖（globset 0.4.18 的 brace 分支
#   支持内部通配，见 crates/scaffold/src/lib.rs make_globset 的 literal_separator(false)）。
#
# granularity 取舍（按桶类型，同 vscode.toml）：
# - 哈希文件名、单文件无意义、文件数以千计的 Chromium 壳层缓存桶 →
#   recycle_granularity = "directory"，glob 锚到桶目录本身（无 /**），prompt = none
#   （桶目录 mtime 恒新，days 过滤无意义）。
# - 按时间累积的文件桶（组件/扩展下载缓存、崩溃转储）→ file 粒度 + days 30。
#
# lint:  cargo run -p pinkbin-scaffold-lint -- scaffolds/chrome.toml
# test:  cargo test -p pinkbin-scaffold --test chrome_safety

id          = "chrome"
name        = "Google Chrome"
homepage    = "https://www.google.com/chrome/"
risk        = "low"
disclaimer  = """\
只清可重生的缓存与转储：网页缓存（Cache/Cache_Data）、Code Cache（JS/WASM 字节码）、\
GPU / WebGPU 着色器缓存（GPUCache / DawnGraphiteCache / DawnWebGPUCache）、\
顶层着色器缓存（GrShaderCache / GraphiteDawnCache / ShaderCache）、Service Worker 缓存、\
blob_storage、组件与扩展下载缓存（component_crx_cache / extensions_crx_cache）、\
崩溃转储（Crashpad）。删掉后 Chrome 下次启动自动重建或重新下载，首次加载网页会略慢，\
离线 Web App 的缓存资源会重新从网络下载。\
绝不删书签（Bookmarks / Bookmarks.bak）、浏览历史（History）、密码（Login Data / \
Login Data For Account）、自动填充（Web Data）、网站图标库（Favicons）、设置\
（Preferences / Secure Preferences / Local State）、标签页恢复（Sessions / Last Browser）、\
登录态（Network 目录下的 Cookies）、网站数据（Local Storage / Session Storage / \
IndexedDB / WebStorage）、扩展状态（Extension State / Local Extension Settings / \
GCM Store，扩展登录 token 在里面）、同步数据（Sync Data / Account Web Data）、\
安全浏览库（Safe Browsing）、WidevineCdm、以及 DIPS、SharedStorage、Shared Dictionary、\
ClientCertificates、MediaDeviceSalts、passkey_enclave_state、trusted_vault.pb 等\
隐私 / 加密物料和一切 *.db / *.db-journal / *.db-wal 数据库文件。\
不覆盖 Chrome 以外 Chromium 应用的数据目录（Quark / CEF / Edge 等，虽然桶名相同）。\
所有删除走系统回收站，可随时还原。清理前请先退出 Chrome，否则运行中被占用的文件会跳过。\
"""

# ---------------------------------------------------------------------------
# detect：Windows 默认路径（四 channel + Chromium）+ macOS / Linux 默认路径 +
# ** 通配兜底（兼容改盘符 / 重定位）。仅影响 UI 显示，不影响清理边界
# （scope 全部要求 Google/Chrome*/User Data/<桶> 两级同时出现才会命中）。
# ---------------------------------------------------------------------------

detect = [
  "%LOCALAPPDATA%/Google/Chrome/User Data",
  "%LOCALAPPDATA%/Google/Chrome Beta/User Data",
  "%LOCALAPPDATA%/Google/Chrome Dev/User Data",
  "%LOCALAPPDATA%/Google/Chrome SxS/User Data",
  "%LOCALAPPDATA%/Chromium/User Data",
  "${HOME}/Library/Application Support/Google/Chrome",
  "${HOME}/Library/Application Support/Chromium",
  "${HOME}/.config/google-chrome",
  "${HOME}/.config/chromium",
  "**/Google/Chrome/User Data",
  "**/Google/Chrome SxS/User Data",
]

# ============================================================================
# L1 profile 级缓存（Default / Profile N 都覆盖）
# ============================================================================

[[scope]]
id                  = "http-cache"
label               = "网页缓存（Cache/Cache_Data，HTTP 磁盘缓存）"
glob                = "**/Google/Chrome*/User Data/{Default,Profile *}/Cache"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

[[scope]]
id                  = "js-bytecode-cache"
label               = "脚本字节码缓存（Code Cache）"
glob                = "**/Google/Chrome*/User Data/{Default,Profile *}/Code Cache"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

[[scope]]
id                  = "gpu-shader-cache"
label               = "GPU / WebGPU 着色器缓存（GPUCache / Dawn 系列）"
glob                = "**/Google/Chrome*/User Data/{Default,Profile *}/{GPUCache,DawnGraphiteCache,DawnWebGPUCache}"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

[[scope]]
id                  = "service-worker-cache"
label               = "Service Worker 缓存（Database / ScriptCache）"
glob                = "**/Google/Chrome*/User Data/{Default,Profile *}/Service Worker"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

[[scope]]
id                  = "blob-storage"
label               = "blob 存储（blob_storage）"
glob                = "**/Google/Chrome*/User Data/{Default,Profile *}/blob_storage"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

# ============================================================================
# L1 User Data 顶层缓存
# ============================================================================

[[scope]]
id                  = "shader-cache"
label               = "顶层着色器缓存（GrShaderCache / GraphiteDawnCache / ShaderCache）"
glob                = "**/Google/Chrome*/User Data/{GrShaderCache,GraphiteDawnCache,ShaderCache}"
mode                = "recycle"
category            = "cache"
recycle_granularity = "directory"
prompt              = { kind = "none" }

[[scope]]
id       = "component-crx-cache"
label    = "组件 / 扩展下载缓存（component_crx_cache / extensions_crx_cache）"
glob     = "**/Google/Chrome*/User Data/{component_crx_cache,extensions_crx_cache}/**"
mode     = "recycle"
category = "cache"
prompt   = { kind = "days", default = 30, label = "保留最近多少天" }

[[scope]]
id       = "crash-dumps"
label    = "崩溃转储（Crashpad）"
glob     = "**/Google/Chrome*/User Data/Crashpad/**"
mode     = "recycle"
category = "cache"
prompt   = { kind = "days", default = 30, label = "保留最近多少天" }
